<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ゆづき検定 3級</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b2b2b; --gray:#9a9a9a; --light:#ececec; --bg:#ffffff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;
    color:var(--ink);background:var(--bg);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;align-items:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;overflow-x:hidden;
  }
  .wrap{width:100%;max-width:400px}
  .screen{display:none}
  .screen.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* スタート */
  .grade{text-align:center;font-size:15px;font-weight:700;letter-spacing:.25em}
  .big{text-align:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:96px;line-height:1;letter-spacing:-.02em;margin:6px 0 20px}
  .pets{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:0 0 26px}
  .pets svg{width:64px;height:64px;display:block;image-rendering:pixelated}
  .hop svg{animation:hop 1.1s steps(2) infinite}
  .hop svg:nth-child(2){animation-delay:.55s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  label.lb{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:8px;letter-spacing:.05em}
  input[type=text]{
    width:100%;font-family:inherit;font-size:18px;padding:13px 16px;
    border:4px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);outline:none;
  }
  input[type=text]::placeholder{color:#c4c4c4}

  .btn{
    display:block;width:100%;margin-top:16px;padding:15px;
    font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.1em;
    color:#fff;background:var(--ink);border:4px solid var(--ink);border-radius:14px;cursor:pointer;
    transition:transform .08s,opacity .2s;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.2;transform:none}
  .btn.ghost{background:#fff;color:var(--ink)}

  /* ローディング */
  .load{text-align:center;padding:60px 0}
  .load p{font-family:"Outfit",sans-serif;font-weight:600;font-size:22px;margin-bottom:12px}
  .bar{height:30px;border:5px solid var(--ink);border-radius:12px;padding:3px;background:#fff}
  .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px}
  .spin{width:92px;height:92px;margin:0 auto 18px;position:relative;animation:rot 1s steps(12) infinite}
  .spin span{position:absolute;left:41px;top:0;width:10px;height:28px;border-radius:5px;background:var(--ink);transform-origin:5px 46px}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* 問題 */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .qhead b{font-family:"Outfit",sans-serif;font-weight:800;font-size:22px;white-space:nowrap}
  .qhead .bar{flex:1;height:22px;border-width:4px;padding:2px}
  .qhead .bar i{transition:width .5s ease;border-radius:3px}
  .qt{font-size:23px;font-weight:700;line-height:1.5;margin-bottom:4px}
  .hint{font-size:13px;color:var(--gray);margin-bottom:18px}
  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{
    font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);
    padding:14px 8px;border:4px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;
    transition:background .12s,color .12s,transform .08s;-webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.97)}
  .opt.sel{background:var(--ink);color:#fff}

  /* 結果 */
  .rlabel{text-align:center;font-size:14px;color:var(--gray);font-weight:700}
  .score{text-align:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:84px;line-height:1;margin:8px 0 4px}
  .score small{font-size:30px;color:var(--gray)}
  .title{text-align:center;font-size:19px;font-weight:700;margin-bottom:22px}
  .rv{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-top:3px solid var(--light)}
  .rv:last-of-type{border-bottom:3px solid var(--light)}
  .rv .q{font-size:15px}
  .tag{font-size:13px;font-weight:700;border:3px solid var(--ink);border-radius:999px;padding:1px 10px;white-space:nowrap}
  .tag.ok{background:var(--ink);color:#fff}
  .sent{text-align:center;font-size:12px;color:var(--gray);margin-top:14px}

  /* ポップアップ */
  .pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:#ffffffd9}
  .pop.on{display:flex}
  .dlg{width:100%;max-width:330px;background:#fff;border:5px solid var(--ink);border-radius:20px;padding:26px 20px 20px;text-align:center;
    animation:dlgIn .4s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes dlgIn{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .dlg .kicker{font-family:"Outfit",sans-serif;font-weight:800;font-size:14px;letter-spacing:.2em;color:var(--gray)}
  .dlg .m1{font-size:22px;font-weight:700;line-height:1.5;margin:6px 0 14px}
  .dlg .pets{margin:0 0 4px}
  .dlg .pets svg{width:56px;height:56px}
  .dlg .btn{margin-top:14px;padding:12px}
  .dlg .warn{display:inline-flex;width:46px;height:46px;border:5px solid var(--ink);border-radius:50%;
    align-items:center;justify-content:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:26px;margin-bottom:6px}
  .shake{animation:dlgIn .4s cubic-bezier(.2,1.5,.4,1) both, shk .45s .45s ease 2}
  @keyframes shk{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .bit{position:fixed;top:-14px;z-index:60;pointer-events:none;background:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

  <!-- スタート -->
  <section class="screen on" id="s-start">
    <p class="grade">ゆづき検定 3級</p>
    <h1 class="big">Quiz</h1>
    <div class="pets hop" id="startPets"></div>
    <label class="lb" for="nick">ニックネーム</label>
    <input type="text" id="nick" maxlength="20" placeholder="ここに入力" autocomplete="off">
    <button class="btn" id="startBtn" disabled>はじめる</button>
  </section>

  <!-- ローディング -->
  <section class="screen" id="s-load">
    <div class="load">
      <p>Loading...</p>
      <div class="bar"><i id="loadBar"></i></div>
    </div>
  </section>

  <!-- 採点中 -->
  <section class="screen" id="s-judge">
    <div class="load">
      <div class="spin" id="spin"></div>
      <p style="font-family:inherit;font-size:17px;font-weight:700">採点中...</p>
    </div>
  </section>

  <!-- 問題 -->
  <section class="screen" id="s-q">
    <div class="qhead"><b id="qn"></b><div class="bar"><i id="qbar"></i></div></div>
    <p class="qt" id="qt"></p>
    <p class="hint" id="hint"></p>
    <div class="opts" id="opts"></div>
    <button class="btn" id="nextBtn" disabled>つぎへ</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="s-res">
    <p class="rlabel" id="resName"></p>
    <div class="score" id="score"></div>
    <p class="title" id="title"></p>
    <div id="review"></div>
    <p class="sent" id="sent"></p>
    <button class="btn ghost" id="againBtn">もういちど</button>
  </section>

</div>

<div class="pop" id="pop"><div class="dlg" id="dlg"></div></div>

<script>
/* ===== 問題 ===== */
const QUESTIONS = [
  { text: "好きなサンリオキャラクターは？",
    options: ["キティ", "マイメロ", "シナモン", "クロミ"],
    answer: ["シナモン"], multi: false },
  { text: "家族構成は？",
    options: ["ぱぱ", "まま", "姉", "妹", "兄", "弟", "犬", "猫", "うさぎ"],
    answer: ["ぱぱ", "まま", "妹", "犬", "うさぎ"], multi: true },
  { text: "ペットの名前は？",
    options: ["モカ・カプチーノ", "ととまる・みる", "かのん・さちか", "りん・ゆめ"],
    answer: ["ととまる・みる"], multi: false }
];

/* ===== 結果の送信先（Lovableの結果ノート） ===== */
const SUBMIT_URL = "https://yuzuki-quiz-note.lovable.app/api/public/submit-result";

/* ===== ドット絵（ととまる・みる） ===== */
const PAL = {O:"#2b2b2b",K:"#3d2e28",T:"#c8894d",N:"#120b08",E:"#ffffff",B:"#33416e",Y:"#d9b45a",W:"#f3ece0",P:"#e3a1a6"};
const DOG = ["........OOOOOOOO........","......OOKKKKKKKKOO......","....OOKKKKKKKKKKKKOO....","...OKKKKKKKKKKKKKKKKO...","..OKKKKTTKKKKKKTTKKKKO..","..OKKKKKKKKKKKKKKKKKKO..",".OKKKKKNEKKKKKKNEKKKKKO.",".OKKKKKNNKKKKKKNNKKKKKO.",".OKKKKKKKTKKKKTKKKKKKKO.","OKKKKKKKTTTKKTTTKKKKKKKO","OKKKKKKTTTTNNTTTTKKKKKKO","OKKKKKKTTTNNNNTTTKKKKKKO","OKKKKKKOTTTNNTTTOKKKKKKO","OKKKKKO.OTTTTTTO.OKKKKKO",".OKKKKO.OKKKKKKO.OKKKKO.",".OKKKO.OBBKKKKBBO.OKKKO.","..OOO.OKBBBYYBBBKO.OOO..","......OKKBBYYBBKKO......",".....OKKKKBBBBKKKKO.....",".....OKKKKKBBKKKKKO.....",".....OKKKKKBBKKKKKO.....",".....OKTTKKKKKKTTKO.....",".....OTTTTOOOOTTTTO.....","......OOOO....OOOO......"];
const RABBIT = [".......OOO....OOO.......", "......OKKKO..OKKKO......", "......OKPKO..OKKKO......", "......OKPKO..OKKKO......", "......OKPKO.OKKKO.......", "......OKPKO.OKKKO.......", ".......OKPKOKKKO........", ".......OKKKKKKKO........", ".....OOKKKKKKKKKOO......", "....OKKKKKKKKKKKKKO.....", "...OKKKKKKKKKKKKKKKO....", "...OKKKKKKKKKKKKKKKO....", "...OKKWNEKKKKKWNEKKO....", "...OKKWNNKKKKKWNNKKO....", "...OKKKWWKKKKKKWWKKO....", "...OKKKKKKKWPWKKKKKO....", "....OKKKKKKWWWKKKKO.....", "...OOKKKKKKKWKKKKKKOO...", "..OKKKKKKKKKKKKKKKKKKO..", "..OKKKKKKKKWWWKKKKKKKKO.", "..OKKKKKKKWWWWWKKKKKKKO.", "..OKKKKKKKKWWWKKKKKKKKO.", "...OKWWWKKKKKKKKKWWWKO..", "....OOOOOOOOOOOOOOOOO..."];
function sprite(map){
  let r = "";
  map.forEach((row, y) => [...row].forEach((c, x) => { if (PAL[c]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; }));
  return `<svg viewBox="0 0 24 24" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}
const PETS = sprite(DOG) + sprite(RABBIT);
document.getElementById("startPets").innerHTML = PETS;

/* くるくる */
document.getElementById("spin").innerHTML = Array.from({length: 12}, (_, i) =>
  `<span style="transform:rotate(${i * 30}deg);opacity:${0.15 + i * 0.075}"></span>`).join("");

/* ===== 動き ===== */
const $ = id => document.getElementById(id);
let cur = 0, nick = "", picks = [];

$("nick").addEventListener("input", e => { $("startBtn").disabled = !e.target.value.trim(); });
$("startBtn").onclick = () => { nick = $("nick").value.trim(); begin(); };
$("nextBtn").onclick = () => { cur++; cur < QUESTIONS.length ? render() : judge(); };
$("againBtn").onclick = () => begin();

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}

function begin(){
  cur = 0; picks = [];
  show("s-load");
  const b = $("loadBar");
  b.style.transition = "none"; b.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    b.style.transition = "width 1.3s steps(9)"; b.style.width = "100%";
  }));
  setTimeout(render, 1600);
}

function render(){
  const q = QUESTIONS[cur];
  picks[cur] = [];
  $("qn").textContent = `Q${cur + 1}`;
  $("qbar").style.width = (cur / QUESTIONS.length * 100) + "%";
  $("qt").textContent = q.text;
  $("hint").textContent = q.multi ? "あてはまるもの、ぜんぶえらんでね" : "ひとつえらんでね";
  $("nextBtn").textContent = cur === QUESTIONS.length - 1 ? "採点する" : "つぎへ";
  $("nextBtn").disabled = true;
  const box = $("opts");
  box.className = "opts" + (q.options.length > 4 ? " two" : "");
  box.innerHTML = "";
  q.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (q.multi) {
        const p = picks[cur], i = p.indexOf(o);
        i < 0 ? p.push(o) : p.splice(i, 1);
        b.classList.toggle("sel");
      } else {
        picks[cur] = [o];
        box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
      }
      $("nextBtn").disabled = picks[cur].length === 0;
      if (navigator.vibrate) navigator.vibrate(8);
    };
    box.appendChild(b);
  });
  show("s-q");
  requestAnimationFrame(() => { $("qbar").style.width = ((cur + 1) / QUESTIONS.length * 100) + "%"; });
}

const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const ordered = (q, arr) => q.options.filter(o => arr.includes(o));

function judge(){
  show("s-judge");
  setTimeout(finish, 1800);
}

function finish(){
  const results = QUESTIONS.map((q, i) => same(picks[i], q.answer));
  const pt = results.filter(Boolean).length, n = QUESTIONS.length;
  const msg = pt === n ? "貴方はゆづきマスターです"
            : pt === n - 1 ? "惜しい、本人に聞こう"
            : "もっと話しかけろ";
  $("resName").textContent = `${nick} さんの結果`;
  $("score").innerHTML = `${pt}<small>/${n}</small>`;
  $("title").textContent = msg;
  $("review").innerHTML = QUESTIONS.map((q, i) => `
    <div class="rv"><span class="q">Q${i + 1}. ${q.text}</span>
    <span class="tag ${results[i] ? "ok" : ""}">${results[i] ? "せいかい" : "ざんねん"}</span></div>`).join("");
  show("s-res");
  setTimeout(() => popup(pt, n, msg), 300);
  send(pt, n);
}

function popup(pt, n, msg){
  const dlg = $("dlg");
  dlg.className = "dlg";
  if (pt === n) {
    dlg.innerHTML = `
      <p class="kicker">CERTIFIED</p>
      <p class="m1">貴方は<br>ゆづきマスターです</p>
      <div class="pets hop">${PETS}</div>
      <p style="font-size:13px;color:var(--gray)">ゆづき検定 3級 合格</p>
      <button class="btn" id="okBtn">OK</button>`;
    setTimeout(confetti, 250);
    if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
  } else if (pt === n - 1) {
    dlg.innerHTML = `
      <p class="kicker">ALMOST</p>
      <p class="m1">${msg}</p>
      <div class="pets">${PETS}</div>
      <button class="btn" id="okBtn">OK</button>`;
  } else {
    dlg.classList.add("shake");
    dlg.innerHTML = `
      <span class="warn">!</span>
      <p class="kicker">ERROR</p>
      <p class="m1">${msg}</p>
      <button class="btn" id="okBtn">はい</button>`;
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }
  $("pop").classList.add("on");
  $("okBtn").onclick = () => $("pop").classList.remove("on");
}

function confetti(){
  for (let i = 0; i < 50; i++) {
    const s = document.createElement("span");
    s.className = "bit";
    const w = 6 + Math.random() * 6, h = w * (1 + Math.random() * 1.5);
    s.style.width = w + "px"; s.style.height = h + "px";
    s.style.borderRadius = "2px";
    s.style.left = Math.random() * 100 + "vw";
    s.style.opacity = (0.35 + Math.random() * 0.65).toFixed(2);
    document.body.appendChild(s);
    const drift = (Math.random() - .5) * 140, rot = (Math.random() - .5) * 720;
    s.animate([
      { transform: "translate(0,0) rotate(0)" },
      { transform: `translate(${drift}px,110vh) rotate(${rot}deg)` }
    ], { duration: 2200 + Math.random() * 1600, delay: Math.random() * 500, easing: "cubic-bezier(.25,.6,.4,1)", fill: "forwards" })
     .onfinish = () => s.remove();
  }
}

function send(pt, n){
  const body = { nickname: nick, score: `${pt}/${n}` };
  QUESTIONS.forEach((q, i) => { body["q" + (i + 1)] = ordered(q, picks[i]).join("、"); });
  fetch(SUBMIT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .then(r => r.json())
    .then(d => { if (d.ok) $("sent").textContent = "結果をゆづきに送信しました"; })
    .catch(() => {});
}
</script>
</body>
</html>
