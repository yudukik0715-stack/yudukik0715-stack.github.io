<!doctype html>
<html lang="ja" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Compass — 目標から逆算する学習ダッシュボード</title>
<meta name="description" content="過去問と解法の型を起点に、単元の穴をなくしながら目標へ進む個人用学習ダッシュボード。">
<meta property="og:title" content="Study Compass — 目標から逆算する学習ダッシュボード">
<meta property="og:description" content="過去問・抽象原理・参考書逆引き・2段階再現チェックで、参考書の完走ではなく目標達成へ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --radius: 1rem;
  --background: #ffffff;
  --foreground: #0f172a;
  --card: #f7f8fa;
  --popover: #ffffff;
  --primary: #2563eb;
  --primary-strong: #1e40af;
  --primary-foreground: #ffffff;
  --muted-foreground: #64748b;
  --accent: #f1f3f6;
  --destructive: #dc2626;
  --warn: #b45309;
  --warn-bar: #f59e0b;
  --success: #059669;
  --border: #e4e7ec;
  --input: #e4e7ec;
  --ring: #2563eb;
}
[data-theme="salmon"] { --primary: #f43f5e; --primary-strong: #be123c; --ring: #fb7185; }
[data-theme="beige"] { --primary: #a16207; --primary-strong: #713f12; --ring: #d97706; --card: #f9f7f3; --accent: #f3efe7; }
[data-theme="blue"] { --primary: #0284c7; --primary-strong: #075985; --ring: #38bdf8; --card: #f5f8fb; }
[data-theme="slate"] { --primary: #2563eb; --primary-strong: #1e40af; --ring: #2563eb; }

* { box-sizing: border-box; border-color: var(--border); }
html, body { margin: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--background);
  color: var(--foreground);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
svg { display: block; }
.muted { color: var(--muted-foreground); }
.m11 { font-size: 11px; color: var(--muted-foreground); }
.m12 { font-size: 12px; color: var(--muted-foreground); }
.m13 { font-size: 13px; color: var(--muted-foreground); }
.b { font-weight: 600; }
.warn { color: var(--warn); }
.ok { color: var(--success); font-weight: 500; }
.txt-primary { color: var(--primary); }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; }
.eyebrow.primary { color: var(--primary); margin-bottom: 8px; }

.app { display: flex; min-height: 100vh; flex-direction: column; }

/* header */
.hd { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; border-bottom: 1px solid var(--border); padding: 12px 16px; }
@media (min-width: 768px) { .hd { padding: 12px 32px; } }
@media (min-width: 1280px) { .hd { height: 64px; flex-wrap: nowrap; padding: 0 32px; } }
.menu-btn { margin-left: -4px; border-radius: 6px; padding: 6px; color: var(--muted-foreground); }
.menu-btn:hover { background: var(--accent); }
@media (min-width: 1024px) { .menu-btn { display: none; } }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--primary-strong); color: var(--primary-foreground); font-size: 13px; font-weight: 700; }
.logo-text { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.goal { min-width: 0; border-left: 1px solid var(--border); padding-left: 24px; }
.goal button { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
.goal input { width: 224px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 15px; font-weight: 600; color: var(--foreground); outline: none; }
.goal input:focus { border-color: var(--primary); }
.tabs { order: 99; display: flex; width: 100%; gap: 4px; overflow-x: auto; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px; font-size: 12.5px; }
@media (min-width: 640px) { .tabs { width: auto; } }
@media (min-width: 1280px) { .tabs { order: 0; } }
.tab { white-space: nowrap; border-radius: 999px; padding: 6px 16px; color: var(--muted-foreground); border: 1px solid transparent; transition: color .15s; }
.tab:hover { color: var(--foreground); }
.tab.on { border-color: var(--border); background: var(--background); font-weight: 600; color: var(--primary-strong); box-shadow: 0 1px 2px rgba(15, 23, 42, .06); }
.hd-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.dots { display: flex; align-items: center; gap: 6px; }
.dot { width: 16px; height: 16px; border-radius: 50%; opacity: .7; transition: opacity .15s; }
.dot:hover { opacity: 1; }
.dot.on { opacity: 1; box-shadow: 0 0 0 2px var(--background), 0 0 0 3px rgba(15, 23, 42, .4); }
.link-muted { color: var(--muted-foreground); }
.link-muted:hover { color: var(--foreground); }
.link-primary { color: var(--primary); font-weight: 500; }

/* layout */
.body { display: flex; flex: 1; }
.side { display: none; width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); }
@media (min-width: 1024px) { .side { display: block; } }
main { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 24px; padding: 24px 16px; }
@media (min-width: 768px) { main { padding: 32px 40px; } }
.topbar { margin-bottom: -8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px; font-size: 12px; }
.topbar .tb-pick { margin-right: auto; display: flex; gap: 8px; }
.tb-btn { border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); border-radius: 999px; padding: 4px 12px; color: var(--primary-strong); font-weight: 600; background: color-mix(in srgb, var(--primary) 6%, transparent); }
.tb-btn .n { margin-left: 6px; font-weight: 500; color: var(--muted-foreground); }
.src-card { margin-bottom: 16px; padding: 14px 20px; }
.src { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 6px 0 0; font-size: 13px; }
.src dt { color: var(--muted-foreground); }
.src dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pdf-link { color: var(--primary-strong); text-decoration: underline; text-underline-offset: 2px; text-align: left; overflow-wrap: anywhere; }
.pdf-link.missing { color: inherit; text-decoration: none; }
.pdf-list { margin: 12px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
.pdf-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.pdf-list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.src-hint { margin: 8px 0 0; font-size: 11px; color: var(--muted-foreground); }
.pick { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.pick li + li { border-top: 1px solid var(--border); }
.pick button { display: flex; width: 100%; gap: 10px; align-items: flex-start; padding: 10px 0; text-align: left; }
.pick button:hover .pk-t { color: var(--primary-strong); }
.pk-main { flex: 1; min-width: 0; }
.pk-t { font-weight: 500; }
.pk-s { font-size: 11px; color: var(--muted-foreground); overflow-wrap: anywhere; }
.pk-st { flex: none; font-size: 11px; color: var(--muted-foreground); }
.pk-st.ok { color: #16a34a; font-weight: 600; }
.drill { display: inline-block; vertical-align: middle; margin-left: 8px; border-radius: 999px; padding: 1px 10px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); color: var(--muted-foreground); }
.drill.ondoku { border-color: var(--primary); color: var(--primary-strong); }
.mode-seg { margin-top: 8px; }
.set-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.set-row .set-t { flex: 1 1 220px; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 4px 0; min-width: 0; }
.set-row .num { flex: none; width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; }
.set-row .set-memo { flex: 1 1 100%; min-height: 36px; font-size: 14px; resize: vertical; }
.res-btns { display: flex; gap: 6px; margin-left: auto; }
.res-btns button { border: 1px solid var(--border); border-radius: 999px; padding: 0 12px; height: 30px; line-height: 1; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; min-width: 44px; flex: none; width: auto; }
.res-btns button.on.r-o { background: #16a34a; border-color: #16a34a; color: #fff; }
.res-btns button.on.r-h { background: #d97706; border-color: #d97706; color: #fff; }
.res-btns button.on.r-x { background: #dc2626; border-color: #dc2626; color: #fff; }
.pk-h { margin: 16px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.seg button { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.seg button.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary-strong); font-weight: 600; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0 0; }

/* menus */
.menu-wrap { position: relative; display: inline-block; }
.menu { position: absolute; z-index: 40; top: calc(100% + 4px); min-width: 240px; max-height: 320px; overflow-y: auto; background: var(--popover); border: 1px solid var(--border); border-radius: 6px; padding: 4px; box-shadow: 0 6px 16px rgba(15, 23, 42, .1); }
.menu.left { left: 0; }
.menu.right { right: 0; }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 6px 8px; border-radius: 4px; font-size: 13px; text-align: left; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--foreground); }
.menu button:hover { background: var(--accent); }

/* sidebar */
.sb { padding: 28px 24px; }
.track { margin-bottom: 24px; display: flex; gap: 4px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px; font-size: 12px; }
.track button { flex: 1; text-align: center; border-radius: 999px; padding: 4px 0; color: var(--muted-foreground); border: 1px solid transparent; }
.track button.on { border-color: var(--border); background: var(--background); font-weight: 600; color: var(--primary-strong); }
.grp-btn { margin-bottom: 4px; display: flex; align-items: center; gap: 4px; color: var(--muted-foreground); }
.grp-btn:hover { color: var(--foreground); }
.sb-title { margin-bottom: 24px; font-size: 18px; font-weight: 600; }
.units { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.units li + li { margin-top: 20px; }
.unit { display: block; width: 100%; text-align: left; transition: opacity .15s; }
.unit:hover { opacity: .7; }
.unit.active { margin: 0 -12px; width: calc(100% + 24px); border-radius: 12px; border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent); background: color-mix(in srgb, var(--primary) 5%, transparent); padding: 12px; }
.unit.active:hover { opacity: 1; }
.unit-row { margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.u-act { font-weight: 500; color: var(--primary-strong); }
.bar { height: 4px; border-radius: 999px; background: var(--border); }
.unit.active .bar { background: var(--background); }
.bar > div { height: 4px; border-radius: 999px; background: var(--primary); }
.bar > div.weak { background: var(--warn-bar); }
.unit-note { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--muted-foreground); }
.unit-note.warn { color: var(--warn); }

/* detail */
.ttl-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ttl { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
@media (min-width: 768px) { .ttl { font-size: 26px; } }
.ttl .sub { font-weight: 400; color: var(--muted-foreground); }
.row-btns { display: flex; align-items: center; gap: 8px; }
.pill-btn { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted-foreground); }
.pill-btn:hover, .icon-btn:hover { color: var(--foreground); }
.icon-btn { display: grid; border: 1px solid var(--border); border-radius: 999px; padding: 8px; color: var(--muted-foreground); }
.grid3 { display: grid; gap: 20px; }
@media (min-width: 768px) { .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); padding: 24px; }
.card-label { margin-bottom: 16px; font-size: 12px; font-weight: 600; color: var(--primary-strong); }
.princ { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.princ li { display: flex; gap: 12px; }
.princ li + li { margin-top: 12px; }
.num { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--background); font-size: 11px; }
.muted-p { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.insight { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 13px; }
.insight summary { cursor: pointer; font-weight: 500; }
.insight p { margin: 8px 0 0; line-height: 1.65; color: var(--muted-foreground); }
.ref + .ref { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
.ref-book { font-size: 14px; color: var(--muted-foreground); }
.ref-page { margin-top: 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.princ-ta { width: 100%; font-size: 14px; line-height: 1.6; }
.princ-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.small-pill { margin-top: 16px; display: inline-flex; border: 1px solid var(--border); background: var(--background); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
.small-pill:hover { border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.check-card { display: flex; flex-direction: column; }
.check-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 0; font-size: 14px; }
.check-row.bb { border-bottom: 1px solid var(--border); }
.btn-primary { margin-top: 16px; height: 40px; border-radius: 10px; background: var(--primary); color: var(--primary-foreground); font-size: 13px; font-weight: 600; text-align: center; transition: background .15s; }
.btn-primary:hover:not(:disabled) { background: var(--primary-strong); }
.btn-primary:disabled { opacity: .4; }
@media (min-width: 768px) { .check-card .btn-primary { margin-top: auto; } }

/* listening */
.lgrid { display: grid; gap: 20px; }
@media (min-width: 768px) { .lgrid { grid-template-columns: 1fr 1.4fr; } }
.causes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cause { border-radius: 12px; border: 1px solid var(--border); background: var(--background); padding: 12px; text-align: left; transition: border-color .15s; }
.cause:hover { border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
.cause.on { border-color: color-mix(in srgb, var(--primary) 30%, transparent); background: color-mix(in srgb, var(--primary) 5%, transparent); }
.cause-l { font-size: 13px; font-weight: 500; }
.cause.on .cause-l { color: var(--primary-strong); }
.cause-h { margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--muted-foreground); }
.two { display: grid; gap: 12px; }
@media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; } }
.fl { font-size: 11px; color: var(--muted-foreground); }
.ta { margin-top: 4px; display: block; width: 100%; min-height: 96px; border: 1px solid var(--input); border-radius: 6px; background: var(--background); padding: 8px 12px; font: inherit; font-size: 13px; color: var(--foreground); resize: vertical; outline: none; }
.ta:focus { box-shadow: 0 0 0 1px var(--ring); }
#lp-diff p { margin: 16px 0 0; font-size: 13px; line-height: 1.65; }
.miss { border-radius: 4px; background: color-mix(in srgb, var(--warn-bar) 20%, transparent); padding: 0 2px; color: var(--warn); }

/* list */
.btn { height: 36px; border-radius: 10px; padding: 0 16px; font-size: 13px; white-space: nowrap; }
.btn.ghost { border: 1px solid var(--border); font-weight: 500; }
.btn.ghost:hover { background: var(--accent); }
.btn.pri { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
.btn.pri:hover:not(:disabled) { background: var(--primary-strong); }
.btn.pri:disabled { opacity: .4; }
.btn.danger { color: var(--destructive); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sel { height: 32px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); padding: 0 12px; font: inherit; font-size: 12px; color: var(--foreground); outline: none; }
.sel:focus { border-color: var(--primary); }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 12px; top: 8px; color: var(--muted-foreground); pointer-events: none; }
.search input { width: 224px; padding-left: 32px; }
.tbl-wrap { overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--card); text-align: left; font-size: 11px; color: var(--muted-foreground); }
th { padding: 10px 20px; font-weight: 500; }
th.px3, td.px3 { padding-left: 12px; padding-right: 12px; }
td { padding: 12px 20px; }
tbody tr { border-top: 1px solid var(--border); cursor: pointer; }
tbody tr:hover { background: var(--card); }
.r { text-align: right; }
.trunc { max-width: 256px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide-sm, .hide-md { display: none; }
@media (min-width: 640px) { .hide-sm { display: table-cell; } }
@media (min-width: 768px) { .hide-md { display: table-cell; } }
.empty { padding: 56px 24px; text-align: center; }
.empty p { margin: 0; }

/* bottom */
.bottom { margin-top: auto; display: grid; gap: 20px; }
@media (min-width: 768px) { .bottom { grid-template-columns: 320px 1fr; } }
.bcard { border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; min-width: 0; }
.ring-card { display: flex; align-items: center; gap: 24px; }
.ring { width: 96px; height: 96px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; }
.ring-in { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%; background: var(--background); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.log li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; }
.log li + li { border-top: 1px solid var(--border); }
.log .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .a { flex-shrink: 0; font-size: 12px; color: var(--muted-foreground); }
.stack { display: flex; height: 8px; overflow: hidden; border-radius: 999px; background: var(--border); }
.cause-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 13px; }
.cause-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cause-list .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 8px; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); }
.sheet { position: fixed; top: 0; bottom: 0; left: 0; z-index: 51; width: 300px; max-width: 85vw; overflow-y: auto; background: var(--background); border-right: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0, 0, 0, .2); }
.sheet-x { position: absolute; right: 16px; top: 16px; color: var(--muted-foreground); }

/* dialogs */
dialog { position: fixed; border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: min(576px, calc(100% - 32px)); max-height: 90vh; overflow-y: auto; color: var(--foreground); background: var(--background); box-shadow: 0 20px 40px rgba(0, 0, 0, .2); }
dialog.sm { width: min(448px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
/* ---------- PDF viewer + note ---------- */
#dlg-viewer { width: 100vw; height: 100dvh; max-width: none; max-height: none; inset: 0; margin: 0; padding: 0; border: 0; border-radius: 0; overflow: hidden; background: #d9dde3; box-shadow: none; }
#dlg-viewer[open] { display: flex; flex-direction: column; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--background); border-bottom: 1px solid var(--border); }
.pv-bar button { font: inherit; font-size: 14px; font-weight: 600; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pv-bar button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.pv-title { flex: 1 1 120px; min-width: 0; font-size: 13px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.pv-tools[hidden] { display: none; }

</style>

<body>

<input type="file" id="imp" accept="application/json,.json" hidden>
<input type="file" id="imp-pdf" accept="application/pdf,.pdf,audio/*,.mp3,.m4a,.aac,.wav,.zip,application/zip" multiple hidden>
<script>
"use strict";

/* ---------- data: units & seed problems ---------- */
const u = (subject, group, names, track) =>
  names.map((name) => ({ id: `${subject}:${group}:${name}`, subject, group, name, ...(track ? { track } : {}) }));

const UNITS = [
  ...u("math", "数I", ["数と式", "集合と論証", "二次関数", "図形と計量", "データの分析"]),
  ...u("math", "数A", ["場合の数", "確率", "整数の性質", "図形の性質"]),
  ...u("math", "数II", ["式と証明", "複素数と方程式", "図形と方程式", "三角関数", "指数・対数関数", "微分法(II)", "積分法(II)"]),
  ...u("math", "数B", ["数列", "統計的な推測"]),
  ...u("math", "数C", ["ベクトル", "平面上の曲線", "複素数平面"]),
  ...u("math", "数III 微分・積分", ["微分・積分の計算", "極限と関数の連続性", "微分の応用・最大最小", "定積分の応用・面積体積"]),
  ...u("physics", "力学", ["等加速度運動", "運動方程式", "運動量と力積", "円運動・単振動", "万有引力"]),
  ...u("physics", "電磁気", ["静電場", "コンデンサー", "直流回路", "電磁誘導", "交流"]),
  ...u("physics", "波動", ["波の性質", "音波・ドップラー", "光の干渉"]),
  ...u("physics", "熱", ["気体分子運動論", "熱力学第一法則"]),
  ...u("physics", "原子", ["光電効果・粒子性", "原子核"]),
  ...u("english", "英語", ["長文", "和訳", "文法", "会話文"], "reading"),
  ...u("english", "リスニング", ["リスニング"], "listening"),
];
// English used to be split by question type (共テ第1〜6問, 二次の和訳・会話文…). Records saved
// under those old units move to the four current ones; the old unit stays in unitWas.
function migrateUnit(id) {
  if (!id || !String(id).startsWith("english:") || UNITS.some((x) => x.id === id)) return id;
  if (/^english:共テ リスニング:/.test(id) || /:リスニング$/.test(id)) return "english:リスニング:リスニング";
  if (/(英文和訳|自由英作文|和訳)$/.test(id)) return "english:英語:和訳";
  if (/会話文$/.test(id)) return "english:英語:会話文";
  if (/(文法・語法|文法)$/.test(id)) return "english:英語:文法";
  return "english:英語:長文";
}
const DRILLS = { ondoku: "音読＋演習用", enshu: "演習用" };

/* ---------- logic ---------- */
const problemScore = (p) => (p.step1 ? 0.5 : 0) + (p.step1 && p.step2 ? 0.5 : 0);
function unitMastery(problems, unitId) {
  const list = problems.filter((p) => p.unitId === unitId);
  if (list.length === 0) return null;
  return Math.round((list.reduce((s, p) => s + problemScore(p), 0) / list.length) * 100);
}
function coverage(units, problems) {
  if (units.length === 0) return 0;
  const covered = units.filter((x) => problems.some((p) => p.unitId === x.id && p.step1)).length;
  return Math.round((covered / units.length) * 100);
}
function similarFor(target, problems) {
  const tags = new Set(target.principles);
  return problems
    .filter((p) => p.id !== target.id && p.principles.some((t) => tags.has(t)))
    .map((p) => ({ p, n: p.principles.filter((t) => tags.has(t)).length }))
    .sort((a, b) => b.n - a.n)
    .map((x) => x.p);
}
const CAUSES = [
  { id: "sound", label: "音声変化・脱落", hint: "連結・脱落・弱形で単語が認識できない" },
  { id: "vocab", label: "語彙・表現", hint: "音は取れたが意味が出てこない" },
  { id: "speed", label: "処理速度・返り読み", hint: "理解が音に追いつかず置いていかれる" },
  { id: "preread", label: "先読み・待ち構え不足", hint: "何を聞き取るべきか準備できていない" },
];
function causeCounts(problems) {
  const c = { sound: 0, vocab: 0, speed: 0, preread: 0 };
  for (const p of problems) for (const k of (p.listening?.causes ?? [])) c[k]++;
  return c;
}
function relTime(at, now) {
  const m = Math.max(0, Math.floor((now - at) / 60000));
  if (m < 1) return "たった今";
  if (m < 60) return `${m}分前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}時間前`;
  return `${Math.floor(h / 24)}日前`;
}
const problemTitle = (p) => `${p.year} ${p.school} ${p.part}`;
function missedWords(script, heard) {
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(Boolean);
  const got = new Set(norm(heard));
  return new Set(norm(script).filter((w) => !got.has(w)));
}
const stepTxt = (p) => (p.step1 && p.step2 ? "2/2" : p.step1 ? "1/2" : "0/2");

/* review schedule: after solving on your own, check again 3 days and 14 days later */
const DAY = 86400000;
const REVIEW_DAYS = [3, 14];
const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function nextReview(p) {
  if (!p.step1 || !p.step1At) return null;
  const stage = p.reviewStage ?? 0;
  if (stage >= REVIEW_DAYS.length) return null;
  return p.step1At + REVIEW_DAYS[stage] * DAY;
}
const isDue = (p, now) => { const n = nextReview(p); return n !== null && dayStart(n) <= dayStart(now); };
const mdTxt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
function reviewTxt(p, now) {
  if (!p.step1) return { text: "—", cls: "muted" };
  const n = nextReview(p);
  if (n === null) return { text: "2回とも完了", cls: "ok" };
  const stage = (p.reviewStage ?? 0) + 1;
  if (dayStart(n) <= dayStart(now)) return { text: `今日 ${stage}回目`, cls: "warn b" };
  return { text: `${mdTxt(n)} に${stage}回目`, cls: "muted" };
}
const examGroup = (e) => (e === "共テ本試" || e === "共テ追試" ? "共テ" : e);
const SUBJECT_JA = { math: "数学", physics: "物理", english: "英語" };

/* ---------- constants & helpers ---------- */
const SUBJECTS = [
  { id: "math", label: "数学" },
  { id: "physics", label: "物理" },
  { id: "english", label: "英語" },
];
const THEMES = [
  { id: "salmon", label: "サーモン/ピンク", color: "#f43f5e" },
  { id: "beige", label: "ベージュ/カーキ", color: "#a16207" },
  { id: "blue", label: "ホワイトブルー", color: "#0284c7" },
  { id: "slate", label: "スレート", color: "#2563eb" },
];
const EXAMS = ["共テ本試", "共テ追試", "二次", "センター"];
const OPACITIES = [1, 0.65, 0.4, 0.2];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => (window.crypto?.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2)}`);
const svg = (w, path, extra = "") => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${path}</svg>`;
const I = {
  menu: svg(20, '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>'),
  chev: svg(12, '<path d="m6 9 6 6 6-6"/>'),
  pencil: svg(14, '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/>'),
  search: svg(16, '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
  x: svg(16, '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  check: svg(16, '<path d="M20 6 9 17l-5-5"/>'),
  alert: svg(16, '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'),
};

/* ---------- state ---------- */
const KEY = "study-compass:v1";
function initial() {
  return {
    goal: "東大理系 / 共通テスト88%",
    theme: "slate",
    subject: "math",
    selected: { math: undefined, physics: undefined, english: undefined },
    view: { kind: "detail" },
    problems: [],
    words: [],
    log: [],
    reflections: [],
    lastReflect: Date.now(),
  };
}
// Sample problems from the first version: removed so the stock starts empty.
const isSample = (p) => /^seed-\d+$/.test(p.id) || p.id === "todai-2023-1";
let S = initial();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const saved = JSON.parse(raw);
    delete saved.view;
    S = { ...S, ...saved };
  }
} catch (e) { /* corrupted storage: keep defaults */ }
S.problems = (S.problems ?? []).filter((p) => !isSample(p));
S.log = (S.log ?? []).filter((l) => !["l1", "l2", "l3"].includes(l.id));
S.selected = Object.fromEntries(Object.entries(S.selected ?? {}).map(([k, v]) => [k, S.problems.some((p) => p.id === v) ? v : undefined]));
// Problems solved before the review feature existed: start their schedule from the last update.
S.problems = S.problems.map((p) => (p.step1 && !p.step1At ? { ...p, step1At: p.updatedAt || Date.now(), reviewStage: 0 } : p));
S.problems = S.problems.map((p) => {
  const to = migrateUnit(p.unitId);
  return to === p.unitId ? p : { ...p, unitId: to, unitWas: p.unitWas ?? p.unitId };
});
// The 解法の型 field used to split on 、 and , too, so "a、b、cの式" became "a" / "b" / "c…".
// Items of one or two letters can only come from that, so join them back with their neighbours.
function joinSplitPrinciples(list) {
  const out = [];
  let glue = false;
  for (const t of list) {
    const short = /^[A-Za-z0-9ａ-ｚＡ-Ｚ０-９]{1,2}$/.test(t);
    if ((short || glue) && out.length) out[out.length - 1] += `、${t}`;
    else out.push(t);
    glue = short;
  }
  return out;
}
// "11/22 ヒントあり" is a note about the attempt, not a 解法 (the user asked to drop it).
const isHintNote = (t) => /^\d{1,2}\/\d{1,2}\s*ヒント(あり|使った|使用)?$/.test(String(t).trim());
S.problems = S.problems.map((p) => (Array.isArray(p.principles) && p.principles.some(isHintNote)
  ? { ...p, principles: p.principles.filter((t) => !isHintNote(t)) } : p));
S.problems = S.problems.map((p) => {
  if (!Array.isArray(p.principles) || !p.principles.some((t) => /^[A-Za-z0-9ａ-ｚＡ-Ｚ０-９]{1,2}$/.test(t))) return p;
  return { ...p, principles: joinSplitPrinciples(p.principles) };
});
S.reflections = S.reflections ?? [];
S.words = Array.isArray(S.words) ? S.words : [];
S.lastReflect = S.lastReflect ?? Date.now();

const ui = {
  group: null, groupKey: null, openMenu: null, editingGoal: false, sheet: false,
  f: { q: "", year: "", exam: "", diff: "", status: "" },
  editing: null, form: null, simP: null, simIdx: 0,
};

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage full or blocked */ }
  document.documentElement.dataset.theme = S.theme;
}
function commit() { save(); render(); }
const logEntry = (text) => ({ id: newId(), text, at: Date.now(), synced: false });
const resetFilters = () => { ui.f = { q: "", year: "", exam: "", diff: "", status: "" }; };

function selectProblem(id) {
  const p = S.problems.find((x) => x.id === id);
  if (!p) return;
  S.subject = p.subject;
  S.selected = { ...S.selected, [p.subject]: p.id };
  S.view = { kind: "detail" };
  commit();
}
function upsert(p0, log) {
  const exists = S.problems.some((x) => x.id === p0.id);
  const p = { ...p0, updatedAt: Date.now() };
  S.problems = exists ? S.problems.map((x) => (x.id === p.id ? p : x)) : [p, ...S.problems];
  S.selected = { ...S.selected, [p.subject]: p.id };
  S.subject = p.subject;
  S.view = { kind: "detail" };
  S.log = [logEntry(log), ...S.log].slice(0, 50);
  commit();
}
function removeProblem(id) {
  S.problems = S.problems.filter((x) => x.id !== id);
  S.selected = Object.fromEntries(Object.entries(S.selected).map(([k, v]) => [k, v === id ? undefined : v]));
  S.view = { kind: "list" };
  resetFilters();
  commit();
}
function patchProblem(id, patch, log) {
  S.problems = S.problems.map((x) => (x.id === id ? { ...x, ...patch, updatedAt: Date.now() } : x));
  if (log) S.log = [logEntry(log), ...S.log].slice(0, 50);
  commit();
}
function patchListening(id, patch, rerender) {
  S.problems = S.problems.map((x) =>
    x.id === id ? { ...x, listening: { causes: [], script: "", heard: "", ...x.listening, ...patch }, updatedAt: Date.now() } : x);
  if (rerender) commit(); else save();
}

/* ---------- derived ---------- */
function derive() {
  const sp = S.problems.filter((p) => p.subject === S.subject);
  const selected = sp.find((p) => p.id === S.selected[S.subject]) ?? sp.find((p) => p.listening) ?? sp[0];
  const listUnit = S.view.kind === "list" ? S.view.unitId : undefined;
  const activeUnitId = S.view.kind === "list" ? listUnit : selected?.unitId;
  const activeUnit = UNITS.find((x) => x.id === activeUnitId);
  const firstGroup = UNITS.find((x) => x.subject === S.subject).group;
  const key = [S.subject, activeUnit?.group, activeUnit?.subject].join("|");
  if (key !== ui.groupKey) {
    ui.groupKey = key;
    ui.group = activeUnit?.subject === S.subject ? activeUnit.group : firstGroup;
  }
  const groupIsListening = UNITS.find((x) => x.group === ui.group)?.track === "listening";
  return { sp, selected, listUnit, activeUnitId, groupIsListening };
}

    const v = su.filter((x) => x.group === g).map((x) => unitMastery(S.problems, x.id) ?? 0);

      <button class="grp-btn eyebrow" data-act="menu" data-menu="grp">${esc(ui.group)} ${I.chev}</button>

/* ---------- weekly check-in ---------- */
const dlgR = document.getElementById("dlg-reflect");
function weekStats(since) {
  const solved = S.problems.filter((p) => p.step1 && p.step1At >= since);
  const byExam = {};
  const bySubject = {};
  for (const p of solved) {
    const g = examGroup(p.exam);
    byExam[g] = (byExam[g] ?? 0) + 1;
    bySubject[SUBJECT_JA[p.subject]] = (bySubject[SUBJECT_JA[p.subject]] ?? 0) + 1;
  }
  const sim = S.problems.filter((p) => p.step2 && p.step2At >= since).length;
  let ok = 0, ng = 0;
  for (const p of S.problems) for (const r of (p.reviewLog ?? [])) if (r.at >= since) r.ok ? ok++ : ng++;
  return { solved: solved.length, byExam, bySubject, sim, ok, ng };
}
function openReflect() {
  const since = S.lastReflect;
  const st = weekStats(since);
  const parts = (o) => Object.entries(o).map(([k, v]) => `${esc(k)} ${v}問`).join(" / ") || "—";
  const prev = S.reflections[S.reflections.length - 1];
  dlgR.innerHTML = `<button type="button" class="dlg-x" data-d="cancel" aria-label="閉じる">${I.x}</button>
    <h2 class="dlg-title">見直し</h2>
    <p class="dlg-desc">${mdTxt(since)} からの勉強をふり返って、目標とずれていないか確かめます。</p>
    <div class="card" style="padding:16px 20px">
      <div class="m11">今の目標</div>
      <div style="margin-top:4px;font-size:17px;font-weight:600">${esc(S.goal)}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n">${st.solved}<span>問</span></div><div class="m11">自力で再現できた</div></div>
      <div class="stat"><div class="stat-n">${st.sim}<span>問</span></div><div class="m11">類題テストクリア</div></div>
      <div class="stat"><div class="stat-n">${st.ok}<span>/${st.ok + st.ng}</span></div><div class="m11">復習で解けた</div></div>
    </div>
    <div class="kv"><span class="m12">試験別</span><span>${parts(st.byExam)}</span></div>
    <div class="kv"><span class="m12">科目別</span><span>${parts(st.bySubject)}</span></div>
    ${prev ? `<div class="kv col"><span class="m12">前回（${mdTxt(prev.at)}）の気づき</span><span>${prev.memo ? esc(prev.memo) : "（メモなし）"}</span></div>` : ""}
    <p style="margin:20px 0 8px;font-size:14px;font-weight:600">この期間の勉強は、目標に向かってた？</p>
    <textarea class="inp" id="rf-memo" rows="3" placeholder="気づいたこと（なくてもOK）"></textarea>
    <div class="sim-actions">
      <button class="btn ghost" data-d="rewrite">目標を書きかえる</button>
      <button class="btn pri" data-d="keep">このままでOK</button>
    </div>`;
  dlgR.showModal();
}
function finishReflect(keep) {
  const memo = document.getElementById("rf-memo").value.trim();
  S.reflections = [...S.reflections, { at: Date.now(), goal: S.goal, memo, keep }].slice(-100);
  S.lastReflect = Date.now();
  S.log = [logEntry(keep ? "見直し：目標そのまま" : "見直し：目標を書きかえる"), ...S.log].slice(0, 50);
  dlgR.close();
  if (!keep) ui.editingGoal = true;
  commit();
  if (keep) toast("見直しを記録しました");
}

});

function diffHtml(l) {
  if (!l.script || !l.heard) return "";
  const missed = missedWords(l.script, l.heard);
  return `<p>${l.script.split(/(\s+)/).map((w) => {
    const k = w.toLowerCase().replace(/[^a-z0-9']/g, "");

  }).join("")}</p>`;
}

function listeningPanel(p) {
  const l = p.listening ?? { causes: [], script: "", heard: "" };
  return `<div class="lgrid">
    <section class="card"><div class="card-label">聞き取れなかった原因</div>

function listBase(unitId) {
  return S.problems.filter((p) => p.subject === S.subject && (!unitId || p.unitId === unitId));
}

function tableHtml(unitId) {
  const base = listBase(unitId);
  const f = ui.f;
  const rows = base
    .filter((p) => !f.year || p.year === Number(f.year))
    .filter((p) => !f.exam || p.exam === f.exam)
    .filter((p) => !f.diff || p.difficulty === Number(f.diff))
    .filter((p) => !f.status || (f.status === "0" ? !p.step1 : f.status === "1" ? p.step1 && !p.step2 : p.step1 && p.step2))
    .filter((p) => {
      if (!f.q) return true;
      const hay = `${problemTitle(p)} ${p.label} ${p.principles.join(" ")} ${p.refs.map((r) => r.book).join(" ")}`;
      return hay.toLowerCase().includes(f.q.toLowerCase());
    })
    .sort((a, b) => b.year - a.year);
  if (rows.length === 0) {
    const none = base.length === 0;
    return `<div class="empty">
      <p style="font-size:14px;font-weight:500">${none ? "この単元の過去問はまだありません" : "条件に合う過去問がありません"}</p>
      <p class="m12" style="margin-top:4px">${none ? "穴を作らないために、まず1問追加しましょう。" : "フィルターをゆるめてみましょう。"}</p>
      ${none ? `<button class="btn pri" style="margin-top:16px" data-act="add">過去問を追加</button>` : ""}
    </div>`;
  }
  return `<table><thead><tr>
      <th>問題</th><th class="px3 hide-md">解法の型</th><th class="px3 hide-sm">区分</th><th class="px3 hide-sm">難易度</th><th class="r">再現</th>
    </tr></thead><tbody>${rows.map((p) => `<tr data-act="select" data-id="${esc(p.id)}">
      <td><div style="font-weight:500">${esc(problemTitle(p))}</div><div class="m11">${esc(p.label)}${p.drill ? `・${DRILLS[p.drill]}` : ""}</div></td>
      <td class="px3 hide-md muted"><div class="trunc">${esc(p.principles.join("・"))}</div></td>
      <td class="px3 hide-sm muted">${esc(p.exam)}</td>
      <td class="px3 hide-sm muted">${"★".repeat(p.difficulty)}</td>
      <td class="r"><span style="font-size:12px;font-weight:500" class="${p.step1 && p.step2 ? "ok" : p.step1 ? "txt-primary" : "muted"}">${stepTxt(p)}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

  </section>`;

    const total = Object.values(counts).reduce((a, b) => a + b, 0);

      ${total === 0 ? `<p class="m13" style="margin:0">まだ原因が記録されていません。設問ごとに原因をタップしましょう。</p>` : `
        <div class="stack">${CAUSES.map((c, i) => `<div style="width:${(counts[c.id] / total) * 100}%;background:var(--primary);opacity:${OPACITIES[i]}"></div>`).join("")}</div>
        <ul class="cause-list">${CAUSES.map((c, i) => `<li><span><span class="sw" style="opacity:${OPACITIES[i]}"></span>${c.label}</span><span class="muted">${Math.round((counts[c.id] / total) * 100)}%</span></li>`).join("")}</ul>`}
    </section>`;
  } else if (S.subject === "english") {
    right = zureCard();
  } else {
    const now = Date.now();
    right = `<section class="bcard"><div class="m12 b" style="margin-bottom:12px">更新ログ</div>
      ${S.log.length === 0 ? `<p class="m13" style="margin:0">まだ記録がありません。</p>` :

  }

}

function askConfirm(msg, ok = "入れる") {
  const d = document.getElementById("dlg-confirm");
  const [head, ...rest] = String(msg).split("\n");
  d.innerHTML = `<h2 class="dlg-title">${esc(head)}</h2>
    <p class="dlg-desc" style="white-space:pre-line">${esc(rest.join("\n"))}</p>
    <div class="sim-actions"><button class="btn ghost" data-c="no">やめる</button><button class="btn pri" data-c="yes">${esc(ok)}</button></div>`;
  return new Promise((res) => {
    const done = (v) => { d.removeEventListener("click", on); d.removeEventListener("cancel", onCancel); if (d.open) d.close(); res(v); };
    const on = (e) => { const c = e.target.closest("[data-c]")?.dataset.c; if (c) done(c === "yes"); };
    const onCancel = () => done(false);
    d.addEventListener("click", on); d.addEventListener("cancel", onCancel);
    try { d.showModal(); } catch { done(window.confirm(String(msg))); }
  });
}

/* ---------- toast ---------- */
function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${kind === "err" ? "err" : ""}`;
  el.innerHTML = `${kind === "plain" ? "" : `<span class="ic">${kind === "err" ? I.alert : I.check}</span>`}<span>${esc(msg)}</span>`;
  // keep toasts above an open modal dialog (dialogs sit in the top layer)
  const dlg = [...document.querySelectorAll("dialog[open]")].pop();
  let box = document.getElementById("toasts");
  if (dlg) {
    box = dlg.querySelector(":scope > .toasts-in");
    if (!box) { box = document.createElement("div"); box.className = "toasts-in"; dlg.appendChild(box); }

  box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// Tolerate a BOM or text wrapped around the JSON (some share sheets add it).
function parseJsonLoose(t) {
  t = String(t).replace(/^\uFEFF/, "");
  try { return JSON.parse(t); } catch (e) {
    const i = t.indexOf("{"), j = t.lastIndexOf("}");
    if (i < 0 || j <= i) throw e;
    return JSON.parse(t.slice(i, j + 1));
  }
}
// Link forms:
//  #d=<base64url of deflate-raw JSON> carries the data inside the link itself. The part after #
//  never reaches the server, so problem data stays out of the public repository.
//  #add=<name> (older) fetches data/<name>.json.
async function inflateLink(b64) {
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(stream).text();
}
async function addFromLink() {
  const d = location.hash.match(/^#d=([\w-]+)$/);
  const m = location.hash.match(/^#add=([\w-]+)$/);
  if (!m && !d) return;
  history.replaceState(null, "", location.pathname + location.search);
  try {
    let text;
    if (d) {
      if (typeof DecompressionStream !== "function") { toast("このブラウザではリンクから追加できません（Safariを最新にしてね）", "err"); return; }
      text = await inflateLink(d[1]);
    } else {
      const r = await fetch(`data/${m[1]}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(String(r.status));
      text = await r.text();
    }
    const o = parseJsonLoose(text);
    if (!o || !(Array.isArray(o.problems) || Array.isArray(o.updates) || o.pdfMap || Array.isArray(o.sets))) throw new Error("bad");
    applyPdfMap(o.pdfMap);
    const ns = mergeSets(o.sets);
    if (ns && !o.problems?.length && !o.updates?.length) toast(`複合プリントを${ns}セット入れました`);
    if (o.problems?.length || o.updates?.length) addProblems(o.problems ?? [], o.updates ?? []);
  } catch (e) {
    toast("過去問のデータを読み込めませんでした", "err");
  }
}
setTimeout(addFromLink, 300);

// "add" files only append problems that are not in the stock yet, and "updates" only fill in
// what is still empty (a solved date on an unsolved problem, or a unit the user has not changed).
// Nothing already saved is removed or overwritten.
const solvedTime = (d) => {
  const t = new Date(`${d}T12:00:00`).getTime();
  if (!Number.isFinite(t) || dayStart(t) > dayStart(Date.now())) return null;
  return Math.min(t, Date.now());
};
async function addProblems(list, updates = []) {
  const key = (p) => [p.subject, p.year, p.school, p.part].map((x) => String(x ?? "").replace(/\s+/g, "")).join("|");
  const ids = new Set(S.problems.map((p) => p.id));
  const keys = new Set(S.problems.map(key));
  list = list.filter(Boolean).map((p) => ({ ...p, unitId: migrateUnit(p.unitId) }));
  const fresh = list
    .filter((p) => p && SUBJECT_JA[p.subject] && UNITS.some((x) => x.id === p.unitId && x.subject === p.subject))
    .filter((p) => !ids.has(p.id) && !keys.has(key(p)))
    .map((p) => {
      const at = p.solvedAt ? solvedTime(p.solvedAt) : null;
      return {
        id: String(p.id || newId()), subject: p.subject, unitId: p.unitId,
        year: Number(p.year) || 0, exam: EXAMS.includes(p.exam) ? p.exam : "二次",
        school: String(p.school ?? ""), part: String(p.part ?? ""), label: String(p.label ?? ""),
        difficulty: Math.min(5, Math.max(1, Number(p.difficulty) || 3)),
        principles: Array.isArray(p.principles) ? p.principles.map(String) : [],
        insight: String(p.insight ?? ""), note: String(p.note ?? ""), refs: [],
        ...(cleanSrc(p.src) ? { src: cleanSrc(p.src) } : {}),
        ...(DRILLS[p.drill] ? { drill: p.drill } : {}),
        step1: !!at, step2: false, updatedAt: Date.now(),
        ...(at ? { step1At: at, reviewStage: 0 } : {}),
        ...(UNITS.find((x) => x.id === p.unitId)?.track === "listening" ? { listening: { causes: [], script: "", heard: "" } } : {}),
      };
    });
  const patches = new Map();
  for (let u of updates) {
    const p = S.problems.find((x) => x.id === u?.id);
    if (!p) continue;
    const patch = {};
    if (u.unitId) u = { ...u, unitId: migrateUnit(u.unitId), fromUnitId: migrateUnit(u.fromUnitId) };
    if (cleanSrc(u.src) && !p.src) patch.src = cleanSrc(u.src);
    if (DRILLS[u.drill] && !p.drill) patch.drill = u.drill;
    if (u.unitId && u.fromUnitId === p.unitId && UNITS.some((x) => x.id === u.unitId && x.subject === p.subject)) {
      patch.unitId = u.unitId;
      if (u.label && u.fromLabel === p.label) patch.label = u.label;
    }
    const at = u.solvedAt ? solvedTime(u.solvedAt) : null;
    if (at && !p.step1) Object.assign(patch, { step1: true, step1At: at, reviewStage: 0 });
    if (u.addNote && !String(p.note ?? "").includes(u.addNote)) patch.note = [p.note, u.addNote].filter(Boolean).join("\n");
    if (Object.keys(patch).length) patches.set(p.id, patch);
  }
  const solvedN = fresh.filter((p) => p.step1).length + [...patches.values()].filter((x) => x.step1).length;
  const unitN = [...patches.values()].filter((x) => x.unitId).length;
  if (fresh.length === 0 && patches.size === 0) { toast("新しく入れるものはありませんでした（もう入っています）"); return; }
  const lines = [];
  if (fresh.length) lines.push(`・${fresh.length}問を追加`);
  if (solvedN) lines.push(`・${solvedN}問を「自力で解けた」にする（解いた日つき）`);
  if (unitN) lines.push(`・${unitN}問の単元を直す`);
  const noteN = [...patches.values()].filter((x) => x.note).length;
  if (noteN) lines.push(`・${noteN}問の結果メモに追記`);
  const srcN = fresh.filter((p) => p.src).length + [...patches.values()].filter((x) => x.src).length;
  if (srcN) lines.push(`・${srcN}問に問題と解答のページを付ける`);
  const drillN = fresh.filter((p) => p.drill).length + [...patches.values()].filter((x) => x.drill).length;
  if (drillN) lines.push(`・${drillN}問に長文の使い方（演習用／音読＋演習用）を付ける`);
  if (!(await askConfirm(`次の内容を入れますか？\n${lines.join("\n")}\n今の記録はそのまま残ります。`))) return;
  S.problems = [...S.problems.map((p) => (patches.has(p.id) ? { ...p, ...patches.get(p.id), updatedAt: Date.now() } : p)), ...fresh];
  S.log = [logEntry(lines.map((x) => x.slice(1)).join("・")), ...S.log].slice(0, 50);
  // new problems can fill thin units, so today's "手薄な単元から" picks are made again
  if (fresh.length && S.today) S.today = { ...S.today, fresh: freshPicks() };

// The user's PDFs keep their original names (e.g. 2026年度_0130_A日程_数学①_問題.pdf) while the
// problems name them differently, so files are matched by content: a data file can carry
// "pdfMap" (first 10 hex digits of SHA-256 -> the name the problems use). Both tables stay in
// this browser only; nothing about the files is in the page itself.
const PDF_MAP_KEY = "study-compass:pdf-map", PDF_HASH_KEY = "study-compass:pdf-hashes";

let pdfHashes = lsGet(PDF_HASH_KEY); // stored key -> hash of that file

function rebuildAlias() {

}

}

    for (const k of [...pdfNames]) {

        const blob = await pdfTx("readonly", (st) => st.get(k));

      } catch (e) { break; }
    }
    for (const k of Object.keys(pdfHashes)) if (!pdfNames.has(k)) delete pdfHashes[k];
    lsSet(PDF_HASH_KEY, pdfHashes);

    if (report || pdfAlias.size > before) toast(`取り込んだPDFのうち${pdfAlias.size}件が問題とつながりました`);

// zip から PDF・音声を取り出す（無圧縮と deflate に対応。名前は UTF-8 として読む）
async function unzipFiles(file) {
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf);
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("zip");
  const n = dv.getUint16(e + 10, true);
  let c = dv.getUint32(e + 16, true);
  const out = [];
  const td = new TextDecoder("utf-8");
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(c, true) !== 0x02014b50) break;
    const method = dv.getUint16(c + 10, true), csize = dv.getUint32(c + 20, true);
    const nlen = dv.getUint16(c + 28, true), xlen = dv.getUint16(c + 30, true), clen = dv.getUint16(c + 32, true);
    const off = dv.getUint32(c + 42, true);

    c += 46 + nlen + xlen + clen;
    if (!name || name.startsWith("._") || !(/\.pdf$/i.test(name) || isAudioName(name))) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = new Blob([new Uint8Array(buf, start, csize)]);
    let blob;
    if (method === 0) blob = raw;
    else if (method === 8 && globalThis.DecompressionStream) blob = await new Response(raw.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    else continue;
    out.push(new File([blob], name, { type: /\.pdf$/i.test(name) ? "application/pdf" : "" }));
  }

}
const impPdf = document.getElementById("imp-pdf");

const PV_PENS = [

const pv = (() => {

    else for (const { i, st } of a.items) list.splice(Math.min(i, list.length), 0, st);
    redrawInk(a.pg);
    save();
  }
  function addBlank() {
    note.extra = (note.extra || 0) + 1;
    const pg = { n: note.extra, blank: true, ratio: pages.find((x) => !x.blank)?.ratio ?? 1 / 1.414 };
    pages.push(pg);
    addPageEl(pg);
    save();
    pg.el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function open(fileName, page) {
    gen++;
    name = fileName; noting = false; undo = []; cur = null; pages = []; doc = null; note = null;
    dlg.innerHTML = `${bar()}<div class="pv-pages"><p class="pv-msg">PDFを読み込んでいます…</p></div>`;
    syncBar();
    if (!dlg.open) dlg.showModal();
    const myGen = gen;
    try {
      const [lib, blob, saved] = await Promise.all([
        loadPdfjs(),
        pdfTx("readonly", (st) => st.get(fileName)),
        notesTx("readonly", (st) => st.get(fileName)).catch(() => undefined),
      ]);
      if (myGen !== gen) return;
      note = saved && typeof saved === "object" && saved.pages ? saved : fresh();
      doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), cMapUrl: PDFJS + "cmaps/", cMapPacked: true, standardFontDataUrl: PDFJS + "standard_fonts/" }).promise;
      if (myGen !== gen) return;
      for (let n = 1; n <= doc.numPages; n++) {
        const vp = (await doc.getPage(n)).getViewport({ scale: 1 });
        pages.push({ n, ratio: vp.width / vp.height });
      }
      for (let n = 1; n <= (note.extra || 0); n++) pages.push({ n, blank: true, ratio: pages[0]?.ratio ?? 1 / 1.414 });
    } catch (e) {
      if (myGen !== gen) return;
      dlg.querySelector(".pv-pages").innerHTML = `<p class="pv-msg">アプリの中で開けませんでした（ネットにつながってないかも）。<br>上の「別タブ」なら見られます。</p>`;
      return;
    }
    const box = dlg.querySelector(".pv-pages");
    box.innerHTML = "";
    io?.disconnect();
    io = new IntersectionObserver((ents) => {
      for (const en of ents) { const pg = en.target._pg; if (en.isIntersecting) renderImg(pg); else dropImg(pg); }
    }, { root: box, rootMargin: "150% 0px" });
    pages.forEach(addPageEl);
    const target = pages.find((x) => !x.blank && x.n === page);
    if (target && page > 1) requestAnimationFrame(() => { box.scrollTop = target.el.offsetTop - 12; });
  }
  function close() {
    if (note && name) save(true);
    gen++;
    io?.disconnect(); io = null;
    doc?.destroy?.(); doc = null;
    dlg.innerHTML = "";
    if (dlg.open) dlg.close();
  }

  dlg.addEventListener("pointerdown", onDown);
  dlg.addEventListener("pointermove", onMove);
  dlg.addEventListener("pointerup", onUp);
  dlg.addEventListener("pointercancel", onUp);
  dlg.addEventListener("touchstart", onTouchStart, { passive: false });
  dlg.addEventListener("touchmove", (e) => { if (cur) e.preventDefault(); }, { passive: false });
  dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
  dlg.addEventListener("click", (e) => {
    const b = e.target.closest("[data-v]");
    if (!b) return;
    switch (b.dataset.v) {
      case "close": close(); break;
      case "tab": openPdfTab(name); break;
      case "rec": close(); setTimeout(() => document.querySelector("#dlg-random .set-list")?.scrollIntoView({ block: "start" }), 50); break;
      case "note":
        noting = !noting; syncBar();
        if (noting) toast(finger ? "ノート：指やペンで書けます" : "ノート：Apple Pencilで書けます（指はスクロール）");
        break;
      case "pen": tool = b.dataset.pen; syncBar(); break;
      case "undo": doUndo(); break;
      case "blank": addBlank(); break;
      case "finger": finger = !finger; syncBar(); break;
    }
  });
  let rz = 0;
  addEventListener("resize", () => {
    if (!dlg.open || !pages.length) return;
    clearTimeout(rz);
    rz = setTimeout(() => {
      const box = dlg.querySelector(".pv-pages");
      for (const pg of pages) {
        redrawInk(pg);
        if (pg.renderedW) { pg.renderedW = 0; const r = pg.el.getBoundingClientRect(), b = box.getBoundingClientRect(); if (r.bottom > b.top - b.height && r.top < b.bottom + b.height) renderImg(pg); }
      }
    }, 200);
  });
  return { open, close };
})();

const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
// 共テ英語は赤本で自分で回すので、ここからは出さない
const pickable = (p) => !(p.subject === "english" && examGroup(p.exam) === "共テ");
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const TODAY_N = { math: 3, physics: 2, english: 1 };
// From the units with the fewest solved problems, one easier unsolved problem each.
function freshPicks() {
  const out = [];
  for (const sub of Object.keys(TODAY_N)) {
    const units = shuffle(UNITS.filter((x) => x.subject === sub).map((x) => ({
      solved: S.problems.filter((p) => p.unitId === x.id && p.step1).length,
      pool: S.problems.filter((p) => p.unitId === x.id && !p.step1 && pickable(p)),
    })).filter((o) => o.pool.length)).sort((a, b) => a.solved - b.solved);
    for (const o of units.slice(0, TODAY_N[sub])) {
      const min = Math.min(...o.pool.map((p) => p.difficulty));
      out.push(shuffle(o.pool.filter((p) => p.difficulty <= min + 1))[0].id);
    }
  }
  return out;
}
// Fixed for the day once made; a new day makes a new set.
function todaySet() {
  const now = Date.now();
  if (S.today?.date !== dayKey(now)) {
    S.today = { date: dayKey(now), due: S.problems.filter((p) => isDue(p, now)).map((p) => p.id), fresh: freshPicks() };
    save();
  }
  const has = (id) => S.problems.some((p) => p.id === id);
  return { ...S.today, due: S.today.due.filter(has), fresh: S.today.fresh.filter(has) };
}
function pickDone(id, t) {
  const p = S.problems.find((x) => x.id === id);
  if (!p) return false;
  const today = (p.reviewLog ?? []).some((r) => dayKey(r.at) === dayKey());
  if (t && t.due.includes(id)) return !isDue(p, Date.now()) && today;
  return p.step1 || today;
}
function pickRows(ids, t) {
  return `<ul class="pick">${ids.map((id) => {
    const p = S.problems.find((x) => x.id === id);

}

const RND_SUBJ = [["mp", "数学＋物理"], ["math", "数学"], ["physics", "物理"], ["english", "英語（個別）"]];
function randomPicks(subj, n, withSolved) {
  const subs = subj === "mp" ? ["math", "physics"] : [subj];
  const pool = S.problems.filter((p) => subs.includes(p.subject) && pickable(p) && (withSolved || !p.step1));
  const byUnit = {};
  for (const p of shuffle(pool)) (byUnit[p.unitId] ??= []).push(p);
  const queues = shuffle(Object.values(byUnit));
  const out = [];
  // one per unit in turn, so the set jumps between units
  while (out.length < n && queues.some((q) => q.length)) {
    for (const q of queues) { if (q.length && out.length < n) out.push(q.shift().id); }
  }
  return shuffle(out);
}
// 複合プリント: ready-made sets of a few problems from different units (one PDF each), solved in
// one sitting and recorded together. Sets arrive with the data link and are kept in S.sets.
function mergeSets(list) {
  if (!Array.isArray(list)) return 0;
  const ok = list.filter((x) => x && x.id && Array.isArray(x.ids) && SUBJECT_JA[x.subject]).map((x) => ({
    id: String(x.id), name: String(x.name ?? x.id), subject: x.subject, minutes: Number(x.minutes) || 0,
    print: String(x.print ?? ""), answer: String(x.answer ?? ""), ids: x.ids.map(String) }));
  if (!ok.length) return 0;
  const m = new Map((S.sets ?? []).map((x) => [x.id, x]));
  for (const x of ok) m.set(x.id, x);
  S.sets = [...m.values()];
  save();
  return ok.length;
}

function recordSet(set) {
  const res = ui.setRes ?? {}, memo = ui.setMemo ?? {};
  const now = Date.now(), d = mdTxt(now);
  let ok = 0, n = 0;
  S.problems = S.problems.map((p) => {
    if (!set.ids.includes(p.id)) return p;
    const r = res[p.id], m = (memo[p.id] ?? "").trim().replace(/\s*\n\s*/g, " ");
    if (!r && !m) return p;
    n++;
    const line = `${d} 複合 ${set.name}：${r ? RES_TXT[r] : "メモ"}${m ? `　${m}` : ""}`;
    const q = { ...p, note: p.note ? `${p.note}\n${line}` : line, updatedAt: now };
    if (r === "o" && !p.step1) { q.step1 = true; q.step1At = now; q.reviewStage = 0; ok++; }
    return q;
  });
  S.setLog = { ...(S.setLog ?? {}), [set.id]: now };
  S.log = [logEntry(`複合 ${set.name} — ${n}問を記録`), ...S.log].slice(0, 50);
  ui.setRes = {}; ui.setMemo = {};
  commit();
  toast(ok ? `記録しました（新しく解けた ${ok}問）` : "記録しました");
}

closeOnBackdrop(dlgT);
closeOnBackdrop(dlgX);

/* ---------- English: 選択肢の振り返り & 単熟語帳 ----------
   p.choiceNotes = [{ id, at, q, basis, pairs: [{ c: 選択肢の言葉, t: 本文の言葉 }], wrong, kind, memo }]
   S.words = [{ id, at, w, m, src, pid, note }]
   Both start empty on old records and travel with the normal backup (they live inside S). */
const ZURE = [
  { id: "over", label: "言いすぎ" },
  { id: "none", label: "書いてない" },
  { id: "opp", label: "逆" },
  { id: "other", label: "その他" },
];
const zureLabel = (k) => ZURE.find((z) => z.id === k)?.label ?? "";
const hasChoicePanel = (p) => p.subject === "english" && !p.listening && UNITS.find((x) => x.id === p.unitId)?.track !== "listening";

function choicePanel(p) {
  const list = p.choiceNotes ?? [];
  const words = S.words.filter((w) => w.pid === p.id);
  return `<div class="lgrid ch-grid">
    <section class="card"><div class="card-label">選択肢の振り返り</div>
      ${list.length ? `<ul class="ch-list">${list.map((c, i) => `<li><button class="ch-item" data-act="ch-open" data-i="${i}">
        <div class="ch-h"><span class="ch-q">${esc(c.q || `設問${i + 1}`)}</span>${c.kind ? `<span class="zure">${zureLabel(c.kind)}</span>` : ""}</div>
        ${c.basis ? `<div class="ch-basis">${esc(c.basis)}</div>` : ""}
        ${c.pairs?.length ? `<div class="ch-pairs">${c.pairs.map((x) => `<span class="pair">${esc(x.c)}<i>⇔</i>${esc(x.t)}</span>`).join("")}</div>` : ""}
        ${c.wrong || c.memo ? `<div class="ch-wrong">${c.wrong ? `選んだ：${esc(c.wrong)}　` : ""}${esc(c.memo)}</div>` : ""}
      </button></li>`).join("")}</ul>`
      : `<p class="muted-p">設問ごとに「根拠の文」「言いかえ」「選んじゃった選択肢のズレ」を残そう。</p>`}
      <button class="small-pill" data-act="ch-open">＋ 設問を書く</button>
    </section>
    <section class="card"><div class="card-label">分からなかった単熟語（この問題）</div>
      ${words.length ? `<ul class="w-list" style="margin:0">${words.map((w) => `<li><div class="w-main"><span class="w-w">${esc(w.w)}</span>　${esc(w.m)}${w.note ? `<div class="w-s">${esc(w.note)}</div>` : ""}</div></li>`).join("")}</ul>`
      : `<p class="muted-p">まだありません。</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-pill" data-act="w-add">＋ 単熟語を足す</button><button class="small-pill" data-act="words">単熟語帳を開く</button></div>
    </section>
  </div>`;
}

function zureCard() {
  const c = Object.fromEntries(ZURE.map((z) => [z.id, 0]));
  let n = 0;
  for (const p of S.problems) for (const x of (p.choiceNotes ?? [])) if (c[x.kind] !== undefined) { c[x.kind]++; n++; }
  return `<section class="bcard"><div class="m12 b" style="margin-bottom:12px">選択肢のズレ（英語全体${n ? ` ${n}件` : ""}）</div>
    ${n === 0 ? `<p class="m13" style="margin:0">まだ記録がありません。間違えた選択肢のズレを残すと、ここに自分のクセが出ます。</p>` : `
      <div class="stack">${ZURE.map((z, i) => `<div style="width:${(c[z.id] / n) * 100}%;background:var(--primary);opacity:${OPACITIES[i]}"></div>`).join("")}</div>
      <ul class="cause-list">${ZURE.map((z, i) => `<li><span><span class="sw" style="opacity:${OPACITIES[i]}"></span>${z.label}</span><span class="muted">${c[z.id]}件</span></li>`).join("")}</ul>`}
  </section>`;
}

/* choice dialog: chips and pair rows change in place, so nothing typed is lost */
const dlgC = document.getElementById("dlg-choice");
const pairRow = (x = { c: "", t: "" }) => `<div class="pair-row">
  <input class="inp" data-pc value="${esc(x.c)}" placeholder="選択肢の言葉" autocapitalize="off">
  <span class="arrow">⇔</span>
  <input class="inp" data-pt value="${esc(x.t)}" placeholder="本文の言葉" autocapitalize="off">
  <button type="button" class="px" data-c="pair-x" aria-label="この組を消す">${I.x}</button></div>`;
function openChoice(i) {
  const p = derive().selected;
  const c = i == null ? null : p.choiceNotes?.[i];
  ui.chIdx = c ? i : null;
  const pairs = c?.pairs?.length ? c.pairs : [{ c: "", t: "" }];
  dlgC.innerHTML = `<button type="button" class="dlg-x" data-c="cancel" aria-label="閉じる">${I.x}</button>
    <h2 class="dlg-title">選択肢の振り返り</h2>
    <p class="dlg-desc">${esc(problemTitle(p))}</p>
    <div class="fstack" style="margin-top:0">
      <label class="field">設問<input class="inp" id="ch-q" value="${esc(c?.q ?? "")}" placeholder="例：問3"></label>
      <label class="field">① 正解の根拠になる本文の文<textarea class="inp" id="ch-basis" rows="3" placeholder="本文から写す（線を引いた所）" autocapitalize="off">${esc(c?.basis ?? "")}</textarea></label>
      <div class="field">② 言いかえ（選択肢の言葉 ⇔ 本文の言葉）
        <div id="ch-pairs">${pairs.map(pairRow).join("")}</div>
        <button type="button" class="small-pill" style="margin-top:8px;justify-self:start" data-c="pair-add">＋ もう1組</button>
      </div>
      <label class="field">③ 選んじゃった選択肢<input class="inp" id="ch-wrong" value="${esc(c?.wrong ?? "")}" placeholder="例：②（正解できたら空でOK）"></label>
      <div class="field">本文とのズレ
        <div class="seg zure-seg">${ZURE.map((z) => `<button type="button" data-z="${z.id}" class="${c?.kind === z.id ? "on" : ""}">${z.label}</button>`).join("")}</div>
      </div>
      <label class="field">一言メモ<input class="inp" id="ch-memo" value="${esc(c?.memo ?? "")}" placeholder="例：only がついてて言いすぎ"></label>
    </div>
    <div class="dlg-actions">
      <div>${c ? `<button type="button" class="btn ghost danger" data-c="del">消す</button>` : ""}</div>
      <div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-c="cancel">やめる</button><button type="button" class="btn pri" data-c="save">保存</button></div>
    </div>`;
  dlgC.showModal();
}
dlgC.addEventListener("click", async (e) => {
  const z = e.target.closest("[data-z]");
  if (z) {
    const on = z.classList.contains("on");
    dlgC.querySelectorAll("[data-z]").forEach((b) => b.classList.remove("on"));
    if (!on) z.classList.add("on");
    return;
  }
  const a = e.target.closest("[data-c]")?.dataset.c;
  if (!a) return;
  if (a === "cancel") { dlgC.close(); return; }
  if (a === "pair-add") {
    document.getElementById("ch-pairs").insertAdjacentHTML("beforeend", pairRow());
    const ins = dlgC.querySelectorAll("[data-pc]"); ins[ins.length - 1].focus();
    return;
  }
  if (a === "pair-x") { e.target.closest(".pair-row").remove(); return; }
  const p = derive().selected;
  const list = [...(p.choiceNotes ?? [])];
  if (a === "del") {
    if (!(await askConfirm("この設問の振り返りを消しますか？", "消す"))) return;
    list.splice(ui.chIdx, 1);
    dlgC.close();
    patchProblem(p.id, { choiceNotes: list }, `${problemTitle(p)} — 選択肢の振り返りを消した`);
    return;
  }
  if (a === "save") {
    const v = (id) => document.getElementById(id).value.trim();
    const pairs = [...dlgC.querySelectorAll(".pair-row")].map((r) => ({ c: r.querySelector("[data-pc]").value.trim(), t: r.querySelector("[data-pt]").value.trim() })).filter((x) => x.c || x.t);
    const prev = ui.chIdx == null ? null : list[ui.chIdx];
    const c = { id: prev?.id ?? newId(), at: prev?.at ?? Date.now(), q: v("ch-q"), basis: v("ch-basis"), pairs, wrong: v("ch-wrong"),
      kind: dlgC.querySelector("[data-z].on")?.dataset.z ?? "", memo: v("ch-memo") };
    if (!c.q && !c.basis && !pairs.length && !c.wrong && !c.kind && !c.memo) { toast("何も書かれていません", "err"); return; }
    if (prev) list[ui.chIdx] = c; else list.push(c);
    dlgC.close();
    patchProblem(p.id, { choiceNotes: list }, `${problemTitle(p)} — 選択肢の振り返り`);
    toast("選択肢の振り返りを保存しました");
  }
});

/* word book */
const dlgW = document.getElementById("dlg-words");
function wordRows() {
  const q = (ui.wq ?? "").toLowerCase();
  const rows = S.words.filter((w) => !q || `${w.w} ${w.m} ${w.src} ${w.note}`.toLowerCase().includes(q));
  if (!rows.length) return `<p class="m13" style="margin:12px 0 0">${S.words.length ? "見つかりません" : "まだありません。上から足してね。"}</p>`;
  return `<ul class="w-list">${rows.map((w) => `<li><div class="w-main"><span class="w-w">${esc(w.w)}</span>　${esc(w.m)}
    <div class="w-s">${[w.src, w.note].filter(Boolean).map(esc).join("　")}</div></div>
    <button type="button" class="w-edit" data-w="edit" data-id="${esc(w.id)}">直す</button></li>`).join("")}</ul>`;
}
function openWords(withProblem) {
  const p = derive().selected;
  ui.wEdit = null; ui.wq = "";
  ui.wSrc = withProblem && p ? { pid: p.id, src: problemTitle(p) } : { pid: "", src: "" };
  dlgW.innerHTML = `<button type="button" class="dlg-x" data-w="close" aria-label="閉じる">${I.x}</button>
    <h2 class="dlg-title">単熟語帳</h2>
    <p class="dlg-desc">分からなかった単語・熟語を貯めておく場所。</p>
    <div class="w-form">
      <label class="field">語<input class="inp" id="w-w" placeholder="例：make up for" autocapitalize="off" autocomplete="off"></label>
      <label class="field">意味<input class="inp" id="w-m" placeholder="例：埋め合わせる" autocomplete="off"></label>
      <label class="field">出てきた問題・年度<input class="inp" id="w-src" value="${esc(ui.wSrc.src)}" placeholder="例：2026 神奈川 ①"></label>
      <label class="field">メモ<input class="inp" id="w-note" placeholder="例文・似た語など" autocomplete="off"></label>
    </div>
    <div class="sim-actions" style="margin-top:12px">
      <button type="button" class="btn ghost danger" data-w="del" hidden>消す</button>
      <button type="button" class="btn ghost" data-w="new" hidden>やめる</button>
      <button type="button" class="btn pri" data-w="save">足す</button>
    </div>
    <div class="pk-h">貯めた単熟語 <span id="w-n">${S.words.length}</span>語</div>
    <label class="search" style="margin-top:6px">${I.search}<input class="sel" id="w-q" placeholder="語・意味・問題で探す" style="width:100%"></label>
    <div id="w-rows">${wordRows()}</div>`;
  dlgW.showModal();
  if (withProblem) document.getElementById("w-w").focus();
}
function wordFormMode(w) {
  ui.wEdit = w?.id ?? null;
  const set = (id, v) => { document.getElementById(id).value = v ?? ""; };
  set("w-w", w?.w); set("w-m", w?.m); set("w-note", w?.note);
  set("w-src", w ? w.src : ui.wSrc.src);
  dlgW.querySelector("[data-w=del]").hidden = !w;
  dlgW.querySelector("[data-w=new]").hidden = !w;
  dlgW.querySelector("[data-w=save]").textContent = w ? "保存" : "足す";
}
function refreshWords() {
  document.getElementById("w-rows").innerHTML = wordRows();
  document.getElementById("w-n").textContent = S.words.length;
  save(); render();
}
dlgW.addEventListener("input", (e) => {
  if (e.target.id !== "w-q") return;
  ui.wq = e.target.value;
  document.getElementById("w-rows").innerHTML = wordRows();
});
dlgW.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing && e.target.closest(".w-form")) { e.preventDefault(); dlgW.querySelector("[data-w=save]").click(); }
});
dlgW.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-w]");
  if (!t) return;
  const a = t.dataset.w;
  if (a === "close") { dlgW.close(); return; }
  if (a === "edit") { wordFormMode(S.words.find((w) => w.id === t.dataset.id)); dlgW.scrollTop = 0; document.getElementById("w-w").focus(); return; }
  if (a === "new") { wordFormMode(null); return; }
  if (a === "del") {
    const w = S.words.find((x) => x.id === ui.wEdit);
    if (!w || !(await askConfirm(`「${w.w}」を単熟語帳から消しますか？`, "消す"))) return;
    S.words = S.words.filter((x) => x.id !== w.id);
    wordFormMode(null); refreshWords();
    return;
  }
  if (a === "save") {
    const v = (id) => document.getElementById(id).value.trim();
    const word = v("w-w");
    if (!word) { toast("語を入れてね", "err"); document.getElementById("w-w").focus(); return; }
    const src = v("w-src");
    if (ui.wEdit) {
      S.words = S.words.map((x) => (x.id === ui.wEdit ? { ...x, w: word, m: v("w-m"), src, note: v("w-note"), pid: src === x.src ? x.pid : (src === ui.wSrc.src ? ui.wSrc.pid : "") } : x));
      toast("直しました");
    } else {
      S.words = [{ id: newId(), at: Date.now(), w: word, m: v("w-m"), src, pid: src === ui.wSrc.src ? ui.wSrc.pid : "", note: v("w-note") }, ...S.words];
      toast(`「${word}」を足しました`);
    }
    wordFormMode(null); refreshWords();
    document.getElementById("w-w").focus();
  }
});

/* ---------- events ---------- */
app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) {
    if (ui.openMenu && !e.target.closest(".menu")) { ui.openMenu = null; render(); }
    return;
  }
  const act = t.dataset.act;
  const id = t.dataset.id;
  if (act !== "menu") ui.openMenu = null;
  const D = derive();
  switch (act) {
    case "menu": ui.openMenu = ui.openMenu === t.dataset.menu ? null : t.dataset.menu; render(); break;
    case "sheet-open": ui.sheet = true; render(); break;
    case "sheet-close": ui.sheet = false; render(); break;
    case "goal-edit": ui.editingGoal = true; render(); break;
    case "subject": S.subject = id; S.view = { kind: "detail" }; commit(); break;
    case "theme": S.theme = id; commit(); break;
    case "export": render(); exportData(); break;
    case "import": render(); imp.click(); break;
    case "import-pdf": render(); openPdfList(); break;
    case "pdf": openPdf(t.dataset.file, t.dataset.page); break;
    case "audio": playAudio(t.dataset.file); break;
    case "group": ui.group = t.dataset.g; render(); break;
    case "unit": S.view = { kind: "list", unitId: id }; ui.sheet = false; resetFilters(); commit(); break;
    case "to-detail": S.view = { kind: "detail" }; commit(); break;
    case "to-list": S.view = { kind: "list" }; resetFilters(); commit(); break;
    case "show-all": S.view = { kind: "list" }; resetFilters(); commit(); break;
    case "add": render(); openProblemDialog(null); break;
    case "edit": render(); openProblemDialog(D.selected); break;
    case "princ-edit": ui.princEdit = D.selected.id; render(); document.getElementById("princ-ta")?.focus(); break;
    case "princ-cancel": ui.princEdit = null; render(); break;
    case "princ-save": {
      const p = D.selected;
      const lines = (document.getElementById("princ-ta")?.value ?? "").split(/\n/).map((x) => x.trim()).filter(Boolean);
      ui.princEdit = null;
      patchProblem(p.id, { principles: lines }, `${problemTitle(p)} — 解法の型を更新`);
      toast("解法の型を保存しました");
      break;
    }
    case "select": ui.sheet = false; selectProblem(id); break;
    case "step1": {
      const p = D.selected;
      patchProblem(p.id, p.step1
        ? { step1: false, step2: false, step1At: undefined, step2At: undefined, reviewStage: 0 }
        : { step1: true, step1At: Date.now(), reviewStage: 0 }, `${problemTitle(p)} — 再現チェック更新`);
      if (!p.step1) toast(`${mdTxt(Date.now() + REVIEW_DAYS[0] * DAY)} に1回目の復習が出ます`, "plain");
      break;
    }
    case "review-ok": case "review-ng": {
      const p = S.problems.find((x) => x.id === id) ?? D.selected;
      const stage = (p.reviewStage ?? 0) + 1;
      const reviewLog = [...(p.reviewLog ?? []), { at: Date.now(), ok: act === "review-ok" }];
      if (act === "review-ok") {
        patchProblem(p.id, { reviewStage: stage, reviewLog }, `${problemTitle(p)} — 復習${stage}回目クリア`);
        toast(stage >= REVIEW_DAYS.length ? "復習2回とも完了" : `次は ${mdTxt(p.step1At + REVIEW_DAYS[stage] * DAY)} に2回目`);
      } else {
        patchProblem(p.id, { step1: false, step2: false, step1At: undefined, step2At: undefined, reviewStage: 0, reviewLog },
          `${problemTitle(p)} — 復習${stage}回目で解けなかった（やり直し）`);
        toast("もう一度自力で再現できたら、そこから復習が始まります", "plain");
      }
      break;
    }
    case "reflect": render(); openReflect(); break;
    case "today": render(); openToday(); break;
    case "random": render(); openRandom(); break;
    case "words": render(); openWords(false); break;
    case "w-add": render(); openWords(true); break;
    case "ch-open": render(); openChoice(t.dataset.i == null ? null : Number(t.dataset.i)); break;
    case "similar": render(); ui.simP = D.selected.id; ui.simIdx = 0; renderSimilar(); dlgS.showModal(); break;
    case "cause": {
      const p = D.selected;
      const cs = p.listening?.causes ?? [];
      patchListening(p.id, { causes: cs.includes(id) ? cs.filter((x) => x !== id) : [...cs, id] }, true);
      break;
    }
  }
});

app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.lp) {
    const p = derive().selected;
    patchListening(p.id, { [t.dataset.lp]: t.value }, false);
    const fresh = S.problems.find((x) => x.id === p.id);
    const box = document.getElementById("lp-diff");
    if (box) box.innerHTML = diffHtml(fresh.listening);
  } else if (t.dataset.f) {
    ui.f[t.dataset.f] = t.value;
    const box = document.getElementById("pl-table");
    if (box) box.innerHTML = tableHtml(derive().listUnit);
  }
});

app.addEventListener("focusout", (e) => {
  if (e.target.id !== "goal-in") return;
  const v = e.target.value.trim();
  if (v && v !== S.goal) {
    S.log = [logEntry(`目標を変更：${S.goal} → ${v}`), ...S.log].slice(0, 50);
    S.goal = v;
  }
  ui.editingGoal = false;
  commit();
});
app.addEventListener("keydown", (e) => {
  if (e.target.id === "goal-in" && e.key === "Enter") e.target.blur();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (ui.sheet || ui.openMenu)) { ui.sheet = false; ui.openMenu = null; render(); }
});

setInterval(() => {
  const b = document.getElementById("bottom");
  if (b && !document.activeElement?.closest?.("#bottom")) b.innerHTML = bottom(derive());
}, 30000);

save();
render();
</script>
